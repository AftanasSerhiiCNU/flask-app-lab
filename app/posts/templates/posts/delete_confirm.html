{% extends "base.html" %} {% block content %}

<div class="container mt-4">
  <div class="card shadow-sm mx-auto" style="max-width: 650px">
    <div class="card-header">
      <h2 class="mb-0">Підтвердження видалення</h2>
    </div>

    <div class="card-body">
      <p>Ви впевнені, що хочете видалити цей пост?</p>

      <h4>{{ post.title }}</h4>

      <p class="text-muted">Автор: {{ post.author }}</p>

      <div class="alert alert-warning">Цю дію неможливо скасувати.</div>

      <form
        method="POST"
        action="{{ url_for('posts.delete_post', id=post.id) }}"
      >
        {{ form.hidden_tag() }}

        <button type="submit" class="btn btn-danger">Так, видалити</button>

        <a
          href="{{ url_for('posts.post_detail', id=post.id) }}"
          class="btn btn-secondary"
        >
          Скасувати
        </a>
      </form>
    </div>
  </div>
</div>

{% endblock %}
