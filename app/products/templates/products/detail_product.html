
{% extends "base.html" %}

{% block content %}

<section class="mb-4">

    <h1 class="mb-4">{{ product.name }}</h1>

    <p>
        <strong>ID товару:</strong>
        {{ product.id }}
    </p>

    <p>
        <strong>Опис:</strong>
        {{ product.description }}
    </p>

    <p>
        <strong>Ціна:</strong>
        {{ product.price }} грн
    </p>

    <a href="{{ url_for('products.product_list') }}"
       class="btn btn-secondary">
        Назад до списку
    </a>

</section>

{% endblock %}
